<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chang.fit 身體評估網站</title>
<meta name="description" content="chang.fit 身體翻譯員：線上身體評估、動作測試自動角度分析、矯正運動動作庫。">
<meta property="og:title" content="chang.fit 身體評估網站">
<meta name="theme-color" content="#6B1E2A">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&amp;family=Noto+Serif+TC:wght@500;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3EDE3}
</style>
<script src="assets/3bef27f4f2b7e1cb057c807c8fda8364.js"></script>
<script src="assets/00defff399ab76383b6b0d6d81833202.js"></script>
<script src="morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="dc-template">

<div style="width: 100%; min-height: 100vh; background: #F3EDE3; color: #2A1A1C; font-family: 'Noto Sans TC', system-ui, sans-serif; font-weight: 400; line-height: 1.7">

  <!-- ===== 頁首導覽 ===== -->
  <header style="background: #F3EDE3; border-bottom: 1px solid rgba(42,26,28,0.14)">
    <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button onClick="{{goHome}}" style="display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 6px 0; cursor: pointer; color: {{wine}}; min-height: 44px">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="14" fill="{{wine}}"></circle><circle cx="15" cy="15" r="11.5" fill="none" stroke="#F3EDE3" stroke-width="0.6"></circle><text x="15" y="20" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" font-weight="700" fill="#F3EDE3">C</text></svg>
        <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; letter-spacing: 0.2em">CHANG.FIT</span>
      </button>
      <nav aria-label="主選單" style="flex: 999 1 420px; min-width: 0; display: flex; gap: 2px; overflow-x: auto; justify-content: flex-end">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="5">
          <button onClick="{{item.go}}" style="flex: 0 0 auto; border: 0; border-bottom: 1px solid {{item.line}}; padding: 10px 14px; min-height: 44px; font: inherit; font-size: 14px; letter-spacing: 0.12em; cursor: pointer; background: transparent; color: {{item.color}}">{{item.label}}</button>
        </sc-for>
      </nav>
      <button onClick="{{goAssessStart}}" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 2px; padding: 0 18px; min-height: 44px; font: inherit; font-size: 14px; font-weight: 500; letter-spacing: 0.14em; cursor: pointer; background: {{wine}}; color: #F3EDE3">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"></path><path d="M7 5H5v15h14V5h-2"></path><path d="M9 13l2 2 4-4"></path></svg>
        開始評估
      </button>
    </div>
  </header>

  <main>
  <!-- ======================= 首頁 ======================= -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">

    <!-- Hero：酒紅底 -->
    <section style="position: relative; overflow: hidden; background: radial-gradient(ellipse 80% 75% at 70% 40%, {{wine}} 0%, {{wineDeep}} 70%); color: #F3EDE3">
      <div style="height: 24px; background: {{wineNight}}"></div>
      <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 72px 24px 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
        <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
          <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; letter-spacing: 0.12em; color: #E2CDB8">SCENE 01 ／ 身體評估</span>
          <h1 style="margin: 0; display: flex; flex-direction: column; gap: 18px; font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-weight: 700; letter-spacing: 0.02em">
            <span style="font-size: clamp(34px, 5vw, 60px); line-height: 1.25">有接收到<br>身體給你的警訊嗎？</span>
            <span style="align-self: flex-start; font-size: clamp(22px, 2.6vw, 32px); font-weight: 500; line-height: 1.4; color: #E2CDB8; border-bottom: 1px solid #F3EDE3; padding-bottom: 6px">連癢都是一種疼痛唷</span>
          </h1>
          <p style="margin: 0; font-size: 17px; font-weight: 300; color: #E2CDB8; max-width: 30em">對著鏡頭完成教練設計的標準動作。系統標出關節位置與角度，依評分給你專屬的矯正動作，再用定期評估追蹤改變。</p>
          <div style="display: flex; flex-wrap: wrap; gap: 14px; padding-top: 6px">
            <button onClick="{{goAssess}}" style="border: 0; border-radius: 2px; padding: 0 30px; min-height: 52px; font: inherit; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; cursor: pointer; background: #F3EDE3; color: {{wine}}">開始評估</button>
            <a href="#how" style="display: inline-flex; align-items: center; border-radius: 2px; padding: 0 26px; min-height: 52px; box-sizing: border-box; font-size: 15px; letter-spacing: 0.16em; text-decoration: none; color: #F3EDE3; border: 1px solid rgba(243,237,227,0.45)">了解流程</a>
          </div>
          <p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.06em; color: #D9C2B0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            影像只在你的裝置上分析，不會上傳。
          </p>
        </div>

        <!-- Hero 視覺：取景框中的骨架＋圓形印章 -->
        <div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
          <div style="position: relative; width: 100%; max-width: 440px">
            <div style="position: relative; width: 100%; aspect-ratio: 4 / 5; background: {{wineNight}}; border: 1px solid rgba(243,237,227,0.22); overflow: hidden">
              <svg viewBox="0 0 320 400" width="100%" height="100%" aria-hidden="true" style="filter: drop-shadow(0 0 6px rgba(243,237,227,0.35))">
                <g stroke="#F3EDE3" stroke-opacity="0.9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="160" cy="70" r="22"></circle>
                  <path d="M160 96 Q168 164 160 234"></path>
                  <path d="M114 116 L206 116"></path>
                  <path d="M114 116 L104 190 L100 258"></path>
                  <path d="M206 116 L234 62 L250 22"></path>
                  <path d="M134 238 L186 238"></path>
                  <path d="M134 238 L130 316 L128 380"></path>
                  <path d="M186 238 L190 316 L192 380"></path>
                </g>
                <path d="M206 116 L206 178" stroke="#E2CDB8" stroke-width="1" stroke-dasharray="3 5"></path>
                <path d="M206 162 A46 46 0 0 0 229 76" stroke="#E2CDB8" stroke-width="1.6" fill="none"></path>
                <g fill="{{wine}}" stroke="#F3EDE3" stroke-width="1.6">
                  <circle cx="114" cy="116" r="4.5"></circle><circle cx="206" cy="116" r="4.5"></circle>
                  <circle cx="104" cy="190" r="4.5"></circle><circle cx="234" cy="62" r="4.5"></circle>
                  <circle cx="100" cy="258" r="4.5"></circle><circle cx="250" cy="22" r="4.5"></circle>
                  <circle cx="134" cy="238" r="4.5"></circle><circle cx="186" cy="238" r="4.5"></circle>
                  <circle cx="130" cy="316" r="4.5"></circle><circle cx="190" cy="316" r="4.5"></circle>
                  <circle cx="128" cy="380" r="4.5"></circle><circle cx="192" cy="380" r="4.5"></circle>
                  <circle cx="163" cy="164" r="3.5"></circle>
                </g>
              </svg>
              <svg viewBox="0 0 100 125" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0">
                <g stroke="#F3EDE3" stroke-opacity="0.6" stroke-width="0.4" fill="none">
                  <path d="M4 12 L4 4 L12 4"></path><path d="M88 4 L96 4 L96 12"></path>
                  <path d="M4 113 L4 121 L12 121"></path><path d="M88 121 L96 121 L96 113"></path>
                </g>
              </svg>
              <svg width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.10; pointer-events: none">
                <filter id="grainHero"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
                <rect width="100%" height="100%" filter="url(#grainHero)"></rect>
              </svg>
              <div style="position: absolute; top: 18px; left: 22px; right: 22px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #E2CDB8">
                <span><span style="color: #FF8A78">●</span> REC</span>
                <span>00:00:12:08</span>
              </div>
              <div style="position: absolute; left: 22px; bottom: 22px; background: rgba(243,237,227,0.94); color: #2A1A1C; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: {{wine}}">R. SHOULDER ELEV</span>
                <span style="font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-size: 32px; font-weight: 500; line-height: 1.15">—°</span>
                <span style="font-size: 11px; color: #6E5A55">示意畫面，非實測</span>
              </div>
            </div>
            <!-- 圓形印章 -->
            <svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true" style="position: absolute; top: -40px; right: -28px">
              <defs><path id="sealPath" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"></path></defs>
              <circle cx="60" cy="60" r="58" fill="#F3EDE3"></circle>
              <circle cx="60" cy="60" r="54" fill="none" stroke="{{wine}}" stroke-width="0.8"></circle>
              <circle cx="60" cy="60" r="32" fill="none" stroke="{{wine}}" stroke-width="0.8"></circle>
              <text font-family="JetBrains Mono, monospace" font-size="8.6" letter-spacing="2.6" fill="{{wine}}"><textPath href="#sealPath">BODY ASSESSMENT · CHANG.FIT · BODY ASSESSMENT · CHANG.FIT ·</textPath></text>
              <text x="60" y="70" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="30" font-weight="700" fill="{{wine}}">C</text>
            </svg>
          </div>
        </div>
      </div>
      <div style="height: 24px; background: {{wineNight}}"></div>
      <svg width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.06; pointer-events: none">
        <filter id="grainBand"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
        <rect width="100%" height="100%" filter="url(#grainBand)"></rect>
      </svg>
    </section>

    <!-- 關鍵字字幕帶 -->
    <div style="background: #F3EDE3; border-bottom: 1px solid rgba(42,26,28,0.14); overflow: hidden">
      <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 22px; font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-size: 17px; letter-spacing: 0.18em; color: {{wine}}">
        <span>肩頸</span><span aria-hidden="true" style="font-size: 9px">◆</span>
        <span>胸椎</span><span aria-hidden="true" style="font-size: 9px">◆</span>
        <span>腰背</span><span aria-hidden="true" style="font-size: 9px">◆</span>
        <span>髖</span><span aria-hidden="true" style="font-size: 9px">◆</span>
        <span>姿態</span><span aria-hidden="true" style="font-size: 9px">◆</span>
        <span>活動度</span>
      </div>
    </div>

    <!-- 行動呼籲：緊接在主視覺下方 -->
    <section style="position: relative; overflow: hidden; background: #F3EDE3; text-align: center; border-bottom: 1px solid rgba(42,26,28,0.10)">
      <div style="max-width: 900px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; align-items: center; gap: 26px">
        <div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; width: 220px">
          <span style="flex: 1; height: 1px; background: {{wine}}; opacity: 0.5"></span>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{wine}}"></path></svg>
          <span style="flex: 1; height: 1px; background: {{wine}}; opacity: 0.5"></span>
        </div>
        <h2 style="margin: 0; font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-size: clamp(30px, 4.4vw, 54px); font-weight: 700; line-height: 1.35; letter-spacing: 0.03em; color: {{wine}}">你的身體，<br>值得被看清楚。</h2>
        <span style="font-size: 14px; letter-spacing: 0.14em; color: #6E5A55">準備一支手機・一個能拍到全身的空間・貼身衣物</span>
        <button onClick="{{goAssess}}" style="border: 0; border-radius: 2px; padding: 0 34px; min-height: 52px; font: inherit; font-size: 15px; font-weight: 500; letter-spacing: 0.16em; cursor: pointer; background: {{wine}}; color: #F3EDE3">開始評估</button>
      </div>
      <svg width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.05; pointer-events: none">
        <filter id="grainEnd"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
        <rect width="100%" height="100%" filter="url(#grainEnd)"></rect>
      </svg>
    </section>

    <!-- 怎麼運作：章節式 -->
    <section id="how" style="position: relative; background: #F3EDE3">
      <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
          <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; letter-spacing: 0.12em; color: {{wine}}">THE PROCESS</span>
          <h2 style="margin: 0; font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-size: clamp(28px, 3.6vw, 42px); font-weight: 700; letter-spacing: 0.02em">評估的五個章節</h2>
          <div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; width: 220px">
            <span style="flex: 1; height: 1px; background: {{wine}}; opacity: 0.5"></span>
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="{{wine}}"></path></svg>
            <span style="flex: 1; height: 1px; background: {{wine}}; opacity: 0.5"></span>
          </div>
          <p style="margin: 0; max-width: 30em; color: #6E5A55; font-weight: 300">每一步都有明確標準。完成後定期再評估，看的是趨勢，不是單次分數。</p>
        </div>
        <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 28px">
          <li style="border-top: 1px solid {{wine}}; padding: 24px 0; display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 60px; font-weight: 500; line-height: 1; color: {{wine}}">01</span>
            <strong style="font-size: 18px; font-weight: 500; letter-spacing: 0.06em">安全篩檢</strong>
            <span style="color: #6E5A55; font-size: 14px; font-weight: 300">先排除需要就醫的警訊，安全第一。</span>
          </li>
          <li style="border-top: 1px solid {{wine}}; padding: 24px 0; display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 60px; font-weight: 500; line-height: 1; color: {{wine}}">02</span>
            <strong style="font-size: 18px; font-weight: 500; letter-spacing: 0.06em">自填問卷</strong>
            <span style="color: #6E5A55; font-size: 14px; font-weight: 300">疼痛程度、生活習慣與改善目標。</span>
          </li>
          <li style="border-top: 1px solid {{wine}}; padding: 24px 0; display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 60px; font-weight: 500; line-height: 1; color: {{wine}}">03</span>
            <strong style="font-size: 18px; font-weight: 500; letter-spacing: 0.06em">動作測試</strong>
            <span style="color: #6E5A55; font-size: 14px; font-weight: 300">對著鏡頭做標準動作，系統標出關節與角度。</span>
          </li>
          <li style="border-top: 1px solid {{wine}}; padding: 24px 0; display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 60px; font-weight: 500; line-height: 1; color: {{wine}}">04</span>
            <strong style="font-size: 18px; font-weight: 500; letter-spacing: 0.06em">評分分級</strong>
            <span style="color: #6E5A55; font-size: 14px; font-weight: 300">每個動作 0–5 分，找出最需要改善的部位。</span>
          </li>
          <li style="border-top: 1px solid {{wine}}; padding: 24px 0; display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 60px; font-weight: 500; line-height: 1; color: {{wine}}">05</span>
            <strong style="font-size: 18px; font-weight: 500; letter-spacing: 0.06em">動作處方</strong>
            <span style="color: #6E5A55; font-size: 14px; font-weight: 300">依結果給你矯正動作與進退階，附教練示範影片。</span>
          </li>
        </ol>
      </div>
      <svg width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.05; pointer-events: none">
        <filter id="grainPaper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter>
        <rect width="100%" height="100%" filter="url(#grainPaper)"></rect>
      </svg>
    </section>

    <!-- 動作庫預覽 -->
    <section style="background: #EAE1D3; border-top: 1px solid rgba(42,26,28,0.10)">
      <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 40px">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 14px">
            <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; letter-spacing: 0.12em; color: {{wine}}">THE LIBRARY</span>
            <h2 style="margin: 0; font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; font-size: clamp(28px, 3.6vw, 42px); font-weight: 700; letter-spacing: 0.02em">動作庫</h2>
          </div>
          <button onClick="{{goLibrary}}" style="border: 1px solid {{wine}}; background: transparent; border-radius: 2px; padding: 0 22px; min-height: 46px; font: inherit; font-size: 14px; letter-spacing: 0.16em; cursor: pointer; color: {{wine}}">看全部動作</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px">
          <sc-for list="{{previewCards}}" as="card" hint-placeholder-count="3">
            <article style="display: flex; flex-direction: column; gap: 16px">
              <sc-if value="{{card.video}}" hint-placeholder-val="{{ false }}">
                <button onClick="{{card.open}}" aria-label="播放{{card.name}}示範影片" style="position: relative; display: block; width: 100%; aspect-ratio: 2.39 / 1; padding: 0; border: 0; cursor: pointer; background: {{wineDeep}}; overflow: hidden">
                  <img src="{{card.poster}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
                  <span style="position: absolute; inset: 0; background: rgba(20,6,9,0.22)"></span>
                  <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(243,237,227,0.92); color: {{wine}}; display: flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
                  </span>
                  <span style="position: absolute; left: 12px; bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #F3EDE3">DEMO</span>
                  <span style="position: absolute; right: 12px; bottom: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F3EDE3; background: rgba(20,6,9,0.6); padding: 2px 6px">{{card.dur}}</span>
                </button>
              </sc-if>
              <sc-if value="{{card.noVideo}}" hint-placeholder-val="{{ true }}">
                <div style="position: relative; aspect-ratio: 2.39 / 1; background: {{wineDeep}}; display: flex; align-items: center; justify-content: center">
                  <span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(243,237,227,0.6); display: flex; align-items: center; justify-content: center; color: #F3EDE3">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
                  </span>

          }).then(function (r) {
            var keep = { labels: r.labels, left: r.left, right: r.right, diff: r.diff, level: r.level, verdict: r.verdict,
              extra: r.extra, snapL: r.snapL, snapR: r.snapR };
            setAna(v.id, { busy: false, res: keep });
          }).catch(function (e) {
            setAna(v.id, { busy: false, err: (e && e.message) || '未知錯誤' });
          });
        },
        open: function () { self.setState({ videoOpen: v.id }); },
        onPick: function (e) {
          var f = e && e.target && e.target.files && e.target.files[0];
          if (!f) { return; }
          var cur = Object.assign({}, (self.state && self.state.rec) || {});
          if (cur[v.id]) { try { URL.revokeObjectURL(cur[v.id]); } catch (x) {} }
          cur[v.id] = URL.createObjectURL(f);
          var curAna = Object.assign({}, (self.state && self.state.ana) || {});
          delete curAna[v.id];   // 換了新影片，舊的分析結果作廢
          self.setState({ rec: cur, ana: curAna });
        } };
    });
    var analysisRows = TEST_LIST.filter(function (v) { return ana[v.id] && ana[v.id].res; }).map(function (v) {
      return Object.assign({ num: v.num, name: v.name }, viewRes(ana[v.id].res));
    });
    var recCount = testCards.filter(function (t) { return t.hasRec; }).length;
    // 問卷：常有酸痛、不舒服或卡頓的部位（複選）
    var BODY_PARTS = ['頸部', '肩部', '手肘', '手腕', '腰部', '髖關節', '膝部', '腳踝', '腳底'];
    var picked = st.bodyParts || {};

      var on = !!picked[p];
      return { label: p, pressed: on ? 'true' : 'false',
        bg: on ? wine : 'transparent', color: on ? '#F3EDE3' : '#2A1A1C', border: on ? wine : 'rgba(42,26,28,0.22)',

          self.setState({ bodyParts: cur });
        } };
    });
    var pickedList = BODY_PARTS.filter(function (p) { return picked[p]; });

    var testById = {};
    TEST_LIST.forEach(function (t) { testById[t.id] = t; });
    var CASE_FINDINGS = [
      { num: '01', area: '肩關節・左側', cause: '左側肩胛骨常處於前傾', effect: '雙肩外展時肩胛骨不穩定',

        tests: ['test-abd'] },
      { num: '02', area: '骨盆・右側', cause: '右側髖關節轉移重心的能力不佳', effect: '骨盆旋轉與左右橫移出現問題',
        detail: '右側髖關節把重心轉移過去的能力不好，所以在骨盆旋轉和骨盆左右橫移這兩個測試，都會出現動作上的問題。',
        tests: ['test-pelvis-rot', 'test-pelvis-shift'] },
      { num: '03', area: '脊椎・連帶影響', cause: '側彎受到骨盆連帶影響', effect: '右側彎比左側彎好',
        detail: '軀幹側彎會受到骨盆的連帶影響。延續第 02 點骨盆的狀況，教練往右側彎的表現比往左側彎好。',
        tests: ['test-sidebend'] }
    ];
    var caseFindings = CASE_FINDINGS.map(function (f) {
      return { num: f.num, area: f.area, cause: f.cause, effect: f.effect, detail: f.detail,
        tests: f.tests.map(function (id) {
          return { label: testById[id].num + ' ' + testById[id].name, open: function () { self.setState({ videoOpen: id }); } };
        }) };
    });
    var testGroups = TEST_CATS.map(function (c) {
      return { name: c[1], en: c[2], items: testCards.filter(function (t) { return t.cat === c[0]; }) };
    });
    var videoCard = function (v) {
      return { region: v.region, key: v.key, name: v.name, desc: '教練示範影片・附字幕', dur: v.dur, poster: v.poster,
        video: true, noVideo: false, open: function () { self.setState({ videoOpen: v.id }); } };
    };
    var allCards = VIDEO_LIST.map(videoCard);
    var previewCards = ['side', 'deadbug', 'thoracic'].map(function (id) { return videoCard(VIDEOS[id]); });
    var openId = VIDEOS[st.videoOpen] ? st.videoOpen : null;
    var libraryCards = allCards.filter(function (c) { return st.region === 'all' || c.key === st.region; });
    var badgeFor = function (cam) {
      if (cam === 'yes') { return { badge: '鏡頭可量', badgeBg: wine, badgeColor: '#F3EDE3', badgeBorder: wine }; }

    };

      return {

        if (st.step >= 4) { self.setState({ screen: 'record' }); } else { self.setState({ step: st.step + 1 }); }
